name: J727P LineageOS 16 baseline kernel

on:
  push:
    branches: [j727p-lineage16-baseline-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j727p-lineage16-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Build clean 3.18.140 baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - name: Check out project and immutable upstream/GCC submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies and save setup log
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential bc bison flex libssl-dev libelf-dev \
              libncurses-dev python3 git curl xz-utils zip cpio file rsync
          } 2>&1 | tee artifacts/setup.log

      - name: Compile clean baseline and save build log
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash ci/scripts/build-j727p-baseline.sh 2>&1 | tee artifacts/build.log

      - name: Upload logs and any generated artifacts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: j727p-lineage16-baseline-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
